server:
  port: 16800

spring:
  application:
    name: ecommerce-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:change-this-secret-to-a-long-random-production-value-32-bytes}
    access-token-minutes: ${SECURITY_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${SECURITY_JWT_REFRESH_TOKEN_DAYS:7}
payment:
  aba-payway:
    api-url: ${ABA_PAYWAY_API_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/generate-qr}
    merchant-id: ${ABA_PAYWAY_MERCHANT_ID:keng.dara.online}
    api-key: ${ABA_PAYWAY_API_KEY:your_sandbox_api_key_here}
    callback-url: ${ABA_PAYWAY_CALLBACK_URL:https://api.yourdomain.com/api/v1/payments/webhook/aba-callback}

  mock-mode: ${PAYMENT_MOCK_MODE:true}